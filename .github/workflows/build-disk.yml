name: Build disk images

# Turns the published container image into installable media:
#   anaconda-iso  bootable installer ISO (bare metal, VirtualBox, Proxmox)
#   qcow2         pre-installed disk for Proxmox / libvirt
#   vmdk          pre-installed disk for VirtualBox
# Run manually from the Actions tab after a container build has pushed :latest.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "CPU architecture"
        required: true
        default: amd64
        type: choice
        options:
          - amd64
          - arm64
      types:
        description: "Disk types to build (space separated: anaconda-iso qcow2 vmdk raw)"
        required: false
        default: "anaconda-iso qcow2 vmdk"
        type: string

env:
  IMAGE_NAME: pridwen
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan matrix
    runs-on: ubuntu-latest
    outputs:
      types: ${{ steps.plan.outputs.types }}
    steps:
      - id: plan
        run: |
          types='${{ inputs.types }}'
          json=$(printf '%s\n' $types | jq -R . | jq -cs .)
          echo "types=${json}" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.disk-type }} (${{ inputs.platform }})
    needs: plan
    runs-on: ${{ inputs.platform == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        disk-type: ${{ fromJson(needs.plan.outputs.types) }}
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "USER_UID=$(id -u)" >> ${GITHUB_ENV}
          echo "USER_GID=$(id -g)" >> ${GITHUB_ENV}

      - name: Install podman (arm64 runners)
        if: inputs.platform == 'arm64'
        run: |
          sudo apt update -y
          sudo apt install -y podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@v7

      # bootc-image-builder pulls with rootful podman, so log in there too.
      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build disk image
        id: build
        uses: osbuild/bootc-image-builder-action@main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso.toml' || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          # Belt and braces with system_files/usr/lib/bootc/install/50-pridwen.toml.
          rootfs: btrfs
          additional-args: --use-librepo=True

      - name: Upload disk image
        uses: actions/upload-artifact@v7
        with:
          name: pridwen-${{ matrix.disk-type }}-${{ inputs.platform }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true
