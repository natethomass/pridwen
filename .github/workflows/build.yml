name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05 UTC daily, picks up base image updates
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      # Signing is skipped until the SIGNING_SECRET repo secret exists (see README).
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_SECRET != '' }}
      IS_DEFAULT_BRANCH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Image name and tag
        run: |
          IMAGE_NAME=$(just image_name)
          DEFAULT_TAG=$(just generate-default-tag)
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> $GITHUB_ENV

      - name: Build image
        run: |
          just build "${IMAGE_NAME}" "${DEFAULT_TAG}"

      # Smaller delta updates for installed machines.
      - name: Rechunk with rpm-ostree
        run: |
          just ostree-rechunk "${IMAGE_NAME}" "${DEFAULT_TAG}"

      - name: Generate build tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags "${IMAGE_NAME}" "${DEFAULT_TAG}")"
          echo "Tags: ${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images "${IMAGE_NAME}" "${DEFAULT_TAG}" "${ALIAS_TAGS}"

      - name: Login to GitHub Container Registry
        if: env.IS_DEFAULT_BRANCH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: env.IS_DEFAULT_BRANCH == 'true'
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile "${IMAGE_NAME}:${tag}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done
          digest=$(< /tmp/digestfile)
          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Install cosign
        if: env.IS_DEFAULT_BRANCH == 'true' && env.HAS_SIGNING_KEY == 'true'
        uses: sigstore/cosign-installer@v4.1.2  # no floating v4 tag exists
        with:
          cosign-release: 'v3.1.2'

      - name: Sign container image
        if: env.IS_DEFAULT_BRANCH == 'true' && env.HAS_SIGNING_KEY == 'true'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # Old bundle format so rpm-ostree/bootc clients can verify with cosign 3.x signatures.
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
