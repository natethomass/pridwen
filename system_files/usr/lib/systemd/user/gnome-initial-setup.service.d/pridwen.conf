# Pridwen replaces the GNOME Initial Setup application with its own welcome
# wizard, but keeps the rest of the harness: GDM's initial-setup session, the
# gnome-initial-setup user and its polkit rules, and the copy worker that carries
# the wizard's dconf choices into the new account.
[Service]
ExecStart=
ExecStart=/usr/libexec/pridwen-firstboot
