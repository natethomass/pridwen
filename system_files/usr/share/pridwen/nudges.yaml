# Dispatch nudges. Count-based ones fire once when the threshold is crossed;
# event-based ones fire when the daemon raises the named event. Each fires
# once per install unless repeat is set. Cap is 3 per day, quiet hours apply.

- id: sudo-ten
  node: sudo
  lesson: sudo-01
  count:
    command: '^sudo\b'
    threshold: 10
  title: Ten sudos in
  body: You have run sudo ten times so far. This lesson shows what sudo actually does under the hood and why only the wheel group is allowed to use it on Pridwen.

- id: systemctl-fifteen
  node: services
  lesson: svc-02
  count:
    command: '^(sudo\s+)?systemctl\b'
    threshold: 15
  title: You live in systemctl now
  body: Fifteen systemctl calls have gone by. This lesson pins down the difference between a unit that is enabled and one that is merely started, which trips up almost everyone at first.

- id: journalctl-ten
  node: logging
  lesson: log-02
  count:
    command: '^journalctl\b'
    threshold: 10
  title: Reading the journal
  body: You have run journalctl ten times. This lesson shows the handful of filters that turn a wall of log text into the single answer you were actually looking for.

- id: podman-five
  node: containers
  lesson: ctr-01
  count:
    command: '^podman\b'
    threshold: 5
  title: Getting comfortable with Podman
  body: You have run five podman commands. This lesson explains why Pridwen runs containers rootless and daemonless, and what that design choice buys you in safety.

- id: rpm-ostree-five
  node: packages
  lesson: pkg-03
  count:
    command: '^(sudo\s+)?rpm-ostree\b'
    threshold: 5
  title: Layering on an image
  body: You have reached for rpm-ostree five times. This lesson explains deployments and rollback, the mechanisms that make changing an image-based system safe to undo.

- id: dnf-attempts
  node: packages
  lesson: pkg-01
  count:
    command: '^(sudo\s+)?(dnf|yum|apt|apt-get)\b'
    threshold: 3
  title: There is no dnf here
  body: You have reached for dnf a few times, and it is not the tool on an image-based host. This lesson shows the three that are, Flatpak, Distrobox, and rpm-ostree, and when to use each.

- id: firewall-five
  node: firewall
  lesson: fw-02
  count:
    command: '^sudo\s+firewall-cmd\b'
    threshold: 5
  title: Shaping the firewall
  body: You have run firewall-cmd five times. This lesson pins down the difference between a runtime change and a permanent one, which is the part of the firewall worth getting right.

- id: ssh-attempts
  node: ssh
  lesson: ssh-02
  count:
    command: '^ssh\s'
    threshold: 5
  title: Reaching other machines
  body: You have made five ssh attempts. This lesson shows how keys, and turning sshd on with intent, make reaching other machines both smoother and much safer.

- id: git-twenty
  node: scripting
  lesson: script-03
  count:
    command: '^git\b'
    threshold: 20
  title: You use git a lot
  body: Twenty git commands have gone by. This lesson takes a short detour into what a commit really is, which saves you the next time your history gets tangled.

- id: chmod-777-repeat
  node: permissions
  lesson: perm-03
  count:
    command: '^(sudo\s+)?chmod\s+(-R\s+)?(777|0777|a\+rwx)\b'
    threshold: 3
  title: The 777 habit
  body: You have opened files wide with chmod 777 three times. This lesson shows the narrower permission that almost always fits instead, and why it is worth learning once.
  repeat: 604800

- id: selinux-first-denial
  node: selinux
  lesson: selinux-01
  event: selinux_denial
  title: SELinux just said no
  body: Something on your system was just blocked by SELinux. This lesson translates the denial into plain English and shows the safe way to let the action through.

- id: bootc-staged
  node: packages
  lesson: pkg-03
  event: bootc_staged
  title: An update is staged
  body: A new Pridwen image is downloaded and ready for the next boot. This lesson shows how to see exactly what changed before you reboot into it.

- id: range-incident
  node: incident-response
  lesson: ir-01
  event: range_incident
  title: Something is happening on the Range
  body: A scenario host on the Range just did something worth noticing. This lesson walks you through the first hour of an incident, one deliberate step at a time.

- id: history-repeat-fail
  node: terminal
  lesson: term-02
  count:
    command: '.'
    threshold: 50
  title: Getting your footing
  body: You are fifty commands into the terminal now. If exit codes are still a mystery, this lesson decodes them so you can tell success from failure at a glance.
