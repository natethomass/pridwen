# Coach rules: scripting (automate)
# Shebangs, execute bit, quoting, set -e, running a script.

- id: script-not-executable
  node: scripting
  lesson: script-01
  when:
    command: '^\./(?P<path>\S+\.sh)\s*$'
    exit: [126]
    probe: exists:{path}
  hint: >-
    The file is there but its execute bit is not set, so the kernel refused to run it (exit 126). `chmod +x {path}` sets the bit, or `bash {path}` runs it once without it.
  why: |
    Running `./{path}` asks the kernel to execute the file as a program, and the kernel
    checks the execute bit first; it was off, so the shell printed "Permission denied"
    and exit status 126, which means found but not runnable. `bash {path}` works without
    the bit because then bash reads the file as input rather than the kernel executing
    it, but that ignores the shebang line. Files start without the bit on purpose, so a
    downloaded file cannot run until you decide it should.
    Ways forward:
      1. `chmod +x {path}`             set the execute bit
      2. `./{path}`                    then run it directly
      3. `bash {path}`                 one-off, no chmod
  man: [chmod(1), bash(1)]
  cooldown: 3600
  priority: 10
- id: script-not-found-dot
  node: scripting
  lesson: script-01
  when:
    command: '^(?P<name>[A-Za-z0-9_.-]+\.sh)\s*$'
    exit: [127]
    probe: exists:{name}
  hint: >-
    The script is right here, but the shell searched PATH and the current directory is not on it, so it said "command not found" (exit 127). Run it as `./{name}`.
  why: |
    A bare name is looked up in the directories listed in PATH, and Fedora leaves `.`
    (the current directory) off that list on purpose: a file named `ls` in a directory
    you cd into must never run instead of the real one. So the shell did not find
    `{name}` and returned 127. Naming the path explicitly with `./` tells the shell you
    mean this file, here. Scripts you use everywhere belong in `~/.local/bin`, which is
    already on PATH, so they run by name from anywhere.
    Ways forward:
      1. `./{name}`                    run the one here
      2. `mv {name} ~/.local/bin/`     put it on PATH for good
      3. `bash {name}`                 also works from the current directory
  man: [bash(1)]
  cooldown: 3600
  priority: 10
- id: script-no-shebang
  node: scripting
  lesson: script-01
  when:
    command: '^\./(?P<path>\S+)\s*$'
    exit: [8]
  hint: >-
    "Exec format error" means the kernel could not tell what should run this file, usually because there is no shebang line. Put `#!/usr/bin/bash` on line one of `{path}`.
  why: |
    When you run `./{path}`, the kernel reads the first bytes of the file to decide how
    to execute it: a compiled program has a known header, and a script has a shebang,
    `#!` followed by the interpreter's path. Neither was there, so the kernel gave up
    with "Exec format error". Add `#!/usr/bin/bash` as the very first line, with nothing
    before it, and the kernel will start bash and hand it the file. The same error on a
    real binary means it was built for a different architecture.
    Ways forward:
      1. `head -1 {path}`                     see what the first line is
      2. `sed -i '1i #!/usr/bin/bash' {path}`  insert the shebang above line 1
      3. `bash {path}`                         run it through bash meanwhile
  man: [bash(1), execve(2)]
  cooldown: 3600
  priority: 8
- id: script-bash-env
  node: scripting
  lesson: script-01
  when:
    command: '#!/usr/bin/env\s+(python|bash|sh|node)'
    exit: any
  hint: >-
    `#!/usr/bin/env bash` finds the interpreter on PATH, the portable choice; `#!/usr/bin/bash` names it directly and is fine on Pridwen. Either works, so pick one and keep the file executable.
  why: |
    A shebang names the interpreter for a script. `#!/usr/bin/bash` gives the exact path,
    which is always right on Pridwen because the image is fixed. `#!/usr/bin/env bash`
    asks `env` to search PATH for `bash`, which is what makes a script portable to
    systems where bash lives elsewhere, and is the usual choice for Python, where the
    interpreter you want may be in a virtual environment. The `env` form has one cost:
    it finds whichever `bash` is first on PATH, so a script run from an unusual
    environment may get a different interpreter than you expect.
    Ways forward:
      1. `head -1 script`               check which shebang the file has
      2. `chmod +x script`              a shebang only matters if the file is executable
      3. `pridwen learn script-01`      the three things that make a file runnable
  man: [env(1), bash(1)]
  cooldown: 86400
  priority: -5
- id: script-sh-vs-bash
  node: scripting
  lesson: script-02
  when:
    command: '^sh\s+(?P<path>\S+\.sh)\b'
    exit: [2]
  hint: >-
    Running a bash script with `sh` turns off bash-only features like `[[ ]]` and arrays, which is a common cause of exit 2. Use `bash {path}`, or write plain POSIX sh and keep `sh`.
  why: |
    On Fedora `sh` is bash started in POSIX mode, and in that mode the bash extensions,
    `[[ ]]`, arrays, `==` in tests, `${var,,}` and others, are syntax errors, which is
    what exit status 2 usually means. The script was written for bash, so run it with
    bash; the shebang inside the file already says so, and `./{path}` would honour it.
    If the script must run on systems without bash, keep `sh` and remove the extensions
    instead. `shellcheck` will tell you which lines are bash-only.
    Ways forward:
      1. `bash {path}`                 run it with the interpreter it was written for
      2. `./{path}`                    let the shebang choose
      3. `shellcheck -s sh {path}`     list the bash-only lines, from a Distrobox
  man: [sh(1), bash(1)]
  cooldown: 3600
  priority: 5
- id: script-unbound-var
  node: scripting
  lesson: script-02
  when:
    command: 'unbound variable'
    exit: any
  hint: >-
    "unbound variable" is `set -u` stopping the script at a variable that was never assigned, usually a typo in the name. Fix the spelling, or give it a default with `${name:-default}`.
  why: |
    With `set -u` on, reading a variable that has never been set is an error rather than
    an empty string, and the script stopped at the line the message names. That is the
    safety switch working: without it, a misspelled name silently becomes nothing, and
    `rm -rf "$dir/"` with an empty `dir` is a famous disaster. Check the spelling first.
    If the variable is genuinely optional, the `${name:-default}` form reads it when set
    and uses the default when not, which satisfies `-u` without turning it off.
    Ways forward:
      1. `grep -n 'name' script.sh`          find every spelling of the variable
      2. `"${name:-}"`                       an empty default for an optional variable
      3. `bash -x script.sh`                 print each line as it runs to see the value
  man: [bash(1)]
  cooldown: 3600
  priority: 5
- id: script-test-spacing
  node: scripting
  lesson: script-02
  when:
    command: '\[\s*\$?\w+[=!]=?\$?\w+\s*\]'
    exit: any
  hint: >-
    `[` is a command, so it needs spaces around itself and its operator; `[ "$a"="$b" ]` is one argument and always true. Write `[ "$a" = "$b" ]`, or the bash form `[[ "$a" == "$b" ]]`.
  why: |
    `[` is not punctuation; it is the `test` command, and like any command it needs a
    space between each of its arguments, including the closing `]`. Written without
    spaces around `=`, the test receives a single string such as `root=other`, and a
    single non-empty string counts as true, so the comparison always passes and never
    warns. In bash, `[[ ... ]]` is part of the shell rather than a separate command, it
    accepts `==` and `&&` inside, and it does not word-split unquoted variables, so it
    fails less quietly.
    Ways forward:
      1. `[ "$a" = "$b" ]`             spaces on both sides of every part
      2. `[[ "$a" == "$b" ]]`          the safer bash form
      3. `pridwen explain test`        every operator `[` understands
  man: [test(1), bash(1)]
  cooldown: 86400
  priority: 5
- id: script-backticks
  node: scripting
  lesson: script-02
  when:
    command: '`[^`]+`'
    exit: any
  hint: >-
    Backticks run a command and use its output, but they do not nest and hide escaping. `$(command)` does the same job, nests cleanly, and reads better inside double quotes.
  why: |
    Both backticks and `$( )` are command substitution: the shell runs what is inside
    and puts its output in place. The old backtick form still works, but a backtick
    inside a backtick needs backslashes, and a backtick is easy to mistake for a single
    quote when reading. `$(command)` nests as far as you like, so
    `$(dirname "$(readlink -f "$0")")` reads naturally, and it behaves cleanly inside
    double quotes. Nothing is broken; this is a habit worth switching early.
    Ways forward:
      1. `$(command)`                     the modern form
      2. `"$(command)"`                   quoted, so the output stays one argument
      3. `shellcheck script.sh`           flags backticks as SC2006
  man: [bash(1)]
  cooldown: 86400
  priority: -3
- id: script-shellcheck-missing
  node: scripting
  lesson: script-03
  when:
    command: '^shellcheck\b'
    exit: [127]
    probe: no_command:shellcheck
  hint: >-
    `shellcheck` is not in the image (exit 127). Install it inside a Distrobox with `sudo dnf install ShellCheck`; it reads a script and flags quoting and portability bugs before they bite.
  why: |
    The shell searched PATH and found no `shellcheck`, so it printed "command not found".
    Pridwen's image is read-only and kept small, and development tools belong in a
    Distrobox, where the box's own `dnf` installs them without touching the host or
    slowing `bootc upgrade`. Because a box shares your home directory, the script you
    are checking is the same file inside it. Layering with `rpm-ostree install
    ShellCheck` also works but adds to every update, so keep that for tools the host
    itself needs.
    Ways forward:
      1. `distrobox enter dev`                          into your box (create one first if needed)
      2. `sudo dnf install -y ShellCheck`               inside the box
      3. `distrobox enter dev -- shellcheck script.sh`  run it from the host in one line
  man: [rpm-ostree(1)]
  cooldown: 86400
  priority: 10
- id: script-crlf
  node: scripting
  lesson: script-01
  when:
    command: '^\./(?P<path>\S+)\s*$'
    exit: [126, 127]
    probe: exists:{path}
  hint: >-
    A script edited on Windows carries a carriage return at the end of each line, so the shebang names an interpreter called `bash^M` that does not exist. `sed -i 's/\r$//' {path}` strips them.
  why: |
    Windows ends lines with two characters, carriage return and line feed, and Linux
    with line feed alone. The kernel read the shebang up to the line feed and so looked
    for `/usr/bin/bash^M`, an interpreter that does not exist, which is the "bad
    interpreter: No such file or directory" message. Every other line of the script has
    the same stray character, so even with a fixed shebang, commands would fail oddly.
    Stripping the carriage returns fixes the whole file at once.
    Ways forward:
      1. `sed -i 's/\r$//' {path}`       remove the carriage returns in place
      2. `file {path}`                    says "with CRLF line terminators" if they are there
      3. `./{path}`                       run it again
  man: [sed(1), dos2unix(1)]
  cooldown: 3600
  priority: 3
