# Coach rules: sudo (secure)
# wheel, sudo -i, redirection, sudoers, the audit trail.

- id: sudo-exit-1
  node: sudo
  lesson: sudo-01
  when:
    command: '^sudo\s+'
    exit: [1]
  hint: >-
    sudo exited 1: either the command it ran failed with 1, the password was wrong three times, or your user is not in `wheel`. `id` shows your groups and `sudo -l` shows what you may run.
  why: |
    sudo passes through the exit status of the command it ran, so a 1 usually belongs to the
    command, and the error text above the prompt is the command's, not sudo's. sudo's own
    refusals also exit 1: `Sorry, try again` three times ends in `3 incorrect password
    attempts`, and a user outside the `wheel` group gets `is not in the sudoers file`. On
    Pridwen only `wheel` may use sudo and root has no password, so sudo is the single door
    to root, and every attempt through it, allowed or refused, lands in the journal under
    your name.
    Ways forward:
      1. `id`                          are you in `wheel`; look for `10(wheel)` in the groups list
      2. `sudo -l`                     what sudo allows for you; `(ALL) ALL` is the wheel grant
      3. `journalctl _COMM=sudo -n 5`  what it recorded; wheel members can read this
      4. `pridwen why`                 the full explanation of the command that failed
  man: [sudo(8), sudoers(5)]
  cooldown: 3600
  priority: -5
- id: sudo-first
  node: sudo
  lesson: sudo-01
  when:
    command: '^sudo\s+\S'
    exit: [0]
  hint: >-
    That was your first sudo. It ran as root because you are in `wheel`, cached your password for five minutes in this terminal, and wrote a line to the journal: `journalctl _COMM=sudo -n 3`.
  why: |
    sudo checked `/etc/sudoers`, found the line `%wheel ALL=(ALL) ALL`, confirmed you are in
    the `wheel` group, asked for your own password rather than root's, and ran the command
    as root. It then cached your password for five minutes in this terminal, so the next few
    commands will not prompt, and wrote a journal line naming you, the terminal, the
    directory and the command. Pridwen is built with no root password so that this line,
    tied to a named person, is the only way anything privileged happens; that is what makes
    the log trustworthy.
    Ways forward:
      1. `journalctl _COMM=sudo -n 3`  the line it wrote: TTY, PWD, USER and COMMAND
      2. `sudo -l`                     the full grant sudo found for you
      3. `sudo -k`                     forget the cached password now, before leaving the terminal
      4. `pridwen learn sudo-01`       what sudo does and why root is never used directly
  man: [sudo(8), sudoers(5)]
  cooldown: 604800
  priority: -10
- id: sudo-su
  node: sudo
  lesson: sudo-02
  when:
    command: '^sudo\s+su\b'
    exit: any
  hint: >-
    `sudo su` works but takes a detour through `su` and leaves two log entries. `sudo -i` gives the same root login shell directly, with root's environment and a single journal line.
  why: |
    `sudo su` runs `su` as root, and `su` then opens a shell as root: two programs, two
    session records, and an environment that is a mixture of yours and root's. `sudo -i`
    (`-i` for login) opens root's login shell directly, with root's own environment, and
    writes one journal line saying you did. Both work on Pridwen, since root has no
    password and `su` alone would fail, but the audit trail is cleaner with `-i`. Prefer
    single `sudo` commands to a root shell where you can, because each command then gets
    its own named log line; use `exit` to leave the root shell.
    Ways forward:
      1. `sudo -i`                     a root login shell; `exit` to leave
      2. `sudo COMMAND`                one privileged command, logged on its own
      3. `journalctl _COMM=sudo -n 3`  compare the entries the two forms leave
      4. `pridwen explain sudo`        the `-i`, `-s` and `-e` flags
  man: [sudo(8), su(1)]
  cooldown: 86400
  priority: 20
- id: sudo-redirect
  node: sudo
  lesson: sudo-02
  when:
    command: '^sudo\s+\S+.*\s>>?\s*(?P<path>/(etc|usr|var|boot|root)\S*)'
  hint: >-
    The `>` is done by your shell, not by sudo, so the file was opened as you and bash said `Permission denied`. `... | sudo tee {path}` writes it as root, or `sudo -e {path}` to edit.
  why: |
    Your shell, bash, sets up redirections before it runs any command. It tried to open
    {path} for writing as your user, was refused because you may not write there, and
    reported `bash: {path}: Permission denied`; sudo never ran. sudo elevates only the
    program named after it and that program's arguments. The fix is to elevate the part
    that writes: `tee` copies its input into a file, so `sudo tee` writes as root while
    `echo` stays as you. On Pridwen files under `/etc` survive upgrades through the three-way
    merge, so this is the right way to add a config file there.
    Ways forward:
      1. `echo text | sudo tee {path}`          replace the file as root; tee echoes the line, which is normal
      2. `echo text | sudo tee -a {path}`       append instead of replace
      3. `sudo -e {path}`                       edit a copy as you, installed as root when you save
      4. `sudo sh -c 'echo text > {path}'`      run the whole pipeline as root
  man: [sudo(8), tee(1), bash(1)]
  cooldown: 3600
  priority: 25
- id: sudo-cd
  node: sudo
  lesson: sudo-02
  when:
    command: '^sudo\s+(cd|export|alias|source|unset|history)\b'
    exit: any
  hint: >-
    `{cmd}` is a shell builtin, so there is no program for sudo to run and it cannot change your shell's state. `sudo -i` gives a root shell where builtins work; `sudo ls /root` covers a quick look.
  why: |
    `{cmd}` is a builtin, a command bash performs itself rather than a program on disk,
    because it changes the shell's own state: its current directory, its variables, its
    aliases. sudo starts a separate process as root and looks for a program called `{cmd}`
    to run in it; there is none, so it answered `command not found`. Even if there were, a
    child process cannot change the directory or variables of the shell that started it.
    For a look at a root-only place, run a real program with sudo; to work inside it, open
    a root shell with `sudo -i`, where the builtin runs in a shell that is itself root.
    Ways forward:
      1. `sudo ls -la /root`           read a root-only directory without changing into it
      2. `sudo -i`                     a root login shell where `cd` and friends work; `exit` to leave
      3. `sudo cat /root/FILE`         read one root-only file
      4. `pridwen explain sudo`        the `-i` flag and what sudo can and cannot elevate
  man: [sudo(8), bash(1)]
  cooldown: 3600
  priority: 20
- id: sudo-visudo
  node: sudo
  lesson: sudo-02
  when:
    command: '^(sudo\s+)?(vim?|nano|tee|sed\s+-i)\s+.*(?P<path>/etc/sudoers(\.d/\S+)?)\b'
    exit: any
  hint: >-
    A syntax error in sudoers locks everyone out of sudo, and on Pridwen root has no password to fall back on. `sudo visudo` (or `sudo visudo -f {path}`) checks the file before saving it.
  why: |
    {path} is part of the sudoers configuration, the rules that say who may run what. sudo
    reads it on every invocation and refuses to run at all if any line does not parse, so
    one typo means `sudo: parse error` for everyone, including you trying to fix it. On
    Pridwen the root account has no password, so there is no root login to recover with,
    only rescue mode from the boot menu. `visudo` opens the file in your editor and refuses
    to save a broken one; `-c` checks the current files without editing. Rules for one
    purpose belong in a small file under `/etc/sudoers.d/`, not in the main file.
    Ways forward:
      1. `sudo visudo -c`                          check every sudoers file now; look for `parsed OK`
      2. `sudo visudo -f {path}`                   edit that file with the syntax check on save
      3. `sudo visudo`                             edit the main `/etc/sudoers` safely
      4. `pridwen explain visudo`                  the `-c` and `-f` flags
  man: [visudo(8), sudoers(5)]
  cooldown: 3600
  priority: 30
- id: sudo-nopasswd
  node: sudo
  lesson: sudo-02
  when:
    command: 'NOPASSWD'
    exit: any
  hint: >-
    `NOPASSWD` means anyone who gets a shell as that user is root without a prompt. Keep it to a single command if you must, and never for ALL on a laptop that leaves the house.
  why: |
    A sudoers rule with `NOPASSWD` tells sudo to skip the password check for that user and
    command. The password prompt is what ties a privileged action to a person who was
    present and knew a secret; without it, any process running as your user, a script you
    downloaded, a browser exploit, or someone who found your laptop unlocked, is root with
    no further step. Pridwen locks root and limits sudo to `wheel` precisely so that every
    path to root passes through a password and a log line. If a specific automated task
    needs it, name one exact command and no more.
    Ways forward:
      1. `sudo visudo -c`                                              check the file parses after any change
      2. `{user} ALL=(root) NOPASSWD: /usr/bin/systemctl restart NAME`   the narrow form: one command, full path, if you truly need it
      3. `sudo -l`                                                     see what the rule now allows without a password
      4. `pridwen learn sudo-02`                                       the habits that keep sudo safe
  man: [sudoers(5)]
  cooldown: 3600
  priority: 30
- id: sudo-sudo
  node: sudo
  lesson: sudo-01
  when:
    command: '^sudo\s+sudo\b'
    exit: any
  hint: >-
    One `sudo` is enough; the second one runs as root, where sudo has nothing left to elevate, so it adds a journal line and nothing else.
  why: |
    The first `sudo` checked your `wheel` membership, asked for your password if it was not
    cached, and ran the rest of the line as root. The rest of the line began with another
    `sudo`, which ran as root, found that root may do anything, and ran the command again
    as root. Nothing extra happened except a second journal entry. This usually comes from
    pasting a command that already had `sudo` in it after typing `sudo` yourself. Pridwen's
    Coach mentions it because the audit trail is easier to read when each line means one
    deliberate action.
    Ways forward:
      1. `sudo COMMAND`                one sudo, one log line
      2. `journalctl _COMM=sudo -n 4`  see the two entries the doubled form left
      3. `sudo -l`                     what one sudo already allows you
      4. `pridwen explain sudo`        the flags, if the second sudo was meant to be one
  man: [sudo(8)]
  cooldown: 86400
  priority: 10
