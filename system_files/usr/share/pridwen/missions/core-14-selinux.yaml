id: core-14-selinux
node: selinux
title: Put the label back
track: core
required: true
minutes: 15
target: host
brief: |
  Sooner or later a guide on the internet will tell you to fix a permission
  problem by turning SELinux off. This mission is the reason you will not.
  SELinux is a second layer of permission checks inside the kernel, separate
  from the mode bits: every file and every process carries a label, the
  policy is the rulebook that says which process labels may touch which
  file labels, and in enforcing mode the kernel refuses anything the
  rulebook does not allow and writes a denial to the log. A label has four
  parts separated by colons, and the third, the type, is the part that
  matters day to day: files in your home are `user_home_t`, a web server's
  pages are `httpd_sys_content_t`, and a web server process may read the
  second but not the first. Most "SELinux is blocking me" problems are a
  file wearing the wrong type, which takes one command to fix.

  Confirm the mode the system is running in with `getenforce` and write it
  down. Then make a small file under `~/pridwen/labels`, read its label with
  `ls -Z` (`-Z` adds the label column), and change its type on purpose with
  `chcon` (change context) to the one a web server's content would carry.
  Save the listing that shows the wrong type, because that is what a denial
  looks like from the file's side. Then ask `restorecon` (restore context)
  to put back the label the policy says the path should have, verbosely so
  it reports what it changed, and keep that report. Read the label once
  more and think about why a web server would still be refused a file
  inside your home, even wearing the label it wanted: the policy also says
  where a web server may look, and your home is not on the list.

  On a job, `restorecon` fixes more SELinux tickets than any other command,
  and knowing it means you never have to switch enforcement off. Done looks
  like `web.html` back at `user_home_t`, a saved listing showing the wrong
  type, and a saved `Relabeled` report. The checker asks `getenforce` for
  the mode, reads the two saved files, and runs `ls -Z` on the file itself.
steps:
  - >-
    Ask `getenforce` for the mode and save it in
    `~/pridwen/answers/getenforce.txt`. Expect `Enforcing`.
  - >-
    Create `~/pridwen/labels/web.html` with a line of text and read its
    label with `ls -Z`. Expect a type of `user_home_t`.
  - >-
    Change its type to `httpd_sys_content_t` on purpose with `chcon`, then
    save the labelled listing in `~/pridwen/answers/wrong-label.txt`. Expect
    the listing to show the new type.
  - >-
    Restore the correct label from policy with `restorecon`, verbosely, and
    save what it reported in `~/pridwen/answers/restorecon.txt`. Expect one
    `Relabeled ... from ... to ...` line.
  - >-
    Read the label once more with `ls -Z`. Expect `user_home_t` again.
hints:
  - >-
    `getenforce` prints the mode. `ls -Z FILE` prints the label before the
    name, and the third colon-separated part is the type. `chcon -t TYPE
    FILE` sets the type by hand (`-t` is type), and `restorecon -v FILE`
    asks the policy what the label should be and applies it, with `-v`
    (verbose) printing a `Relabeled` line when it changed something.
  - >-
    `mkdir -p ~/pridwen/labels` makes the directory,
    `echo '<h1>hello</h1>' > ~/pridwen/labels/web.html` makes the file, and
    `>` after `ls -Z` or `restorecon -v` sends their output into an answer
    file. Run `restorecon` with `-v` or it prints nothing at all, even when
    it relabels.
  - >-
    `getenforce > ~/pridwen/answers/getenforce.txt`, then
    `mkdir -p ~/pridwen/labels`, then
    `echo '<h1>hello</h1>' > ~/pridwen/labels/web.html`, then
    `chcon -t httpd_sys_content_t ~/pridwen/labels/web.html`, then
    `ls -Z ~/pridwen/labels/web.html > ~/pridwen/answers/wrong-label.txt`,
    then
    `restorecon -v ~/pridwen/labels/web.html > ~/pridwen/answers/restorecon.txt`,
    then `ls -Z ~/pridwen/labels/web.html`.
checks:
  - id: enforcing
    type: selinux
    mode: enforcing
    fail: >-
      `getenforce` says {actual}; Pridwen runs `Enforcing` and this mission
      expects it. `sudo setenforce 1` turns enforcement back on until
      reboot; if it says `Disabled`, the kernel was booted with SELinux off
      and needs a reboot without that setting.
  - id: wrong-label
    type: path_contains
    path: "{home}/pridwen/answers/wrong-label.txt"
    regex: 'httpd_sys_content_t'
    fail: >-
      `wrong-label.txt` is {actual} and shows no `httpd_sys_content_t`; it
      should be the `ls -Z` listing taken while the file wore the wrong
      type. `chcon -t httpd_sys_content_t ~/pridwen/labels/web.html`, then
      `ls -Z ~/pridwen/labels/web.html > ~/pridwen/answers/wrong-label.txt`,
      before you restore it.
  - id: restored
    type: cmd_output
    cmd: ["ls", "-Z", "{home}/pridwen/labels/web.html"]
    regex: 'user_home_t'
    fail: >-
      `ls -Z` reports `{actual}`; policy says a file under your home should
      carry `user_home_t`. `restorecon -v ~/pridwen/labels/web.html` puts the
      policy's label back (if `ls` says the file is missing, create it first
      with `echo '<h1>hello</h1>' > ~/pridwen/labels/web.html`).
  - id: restorecon-log
    type: path_contains
    path: "{home}/pridwen/answers/restorecon.txt"
    regex: 'Relabeled'
    fail: >-
      `restorecon.txt` is {actual} and holds no `Relabeled` line.
      `restorecon -v` prints one only when the label actually changed, so
      set the wrong type first with
      `chcon -t httpd_sys_content_t ~/pridwen/labels/web.html`, then
      `restorecon -v ~/pridwen/labels/web.html > ~/pridwen/answers/restorecon.txt`.
cleanup: |
  rm -rf ~/pridwen/labels
  rm -f ~/pridwen/answers/getenforce.txt ~/pridwen/answers/wrong-label.txt ~/pridwen/answers/restorecon.txt
