id: core-12-sudo
node: sudo
title: Prove you are accountable
track: core
required: true
minutes: 10
target: host
brief: |
  There is no root password on this machine. When you need to act as root you
  ask with your own password, and the system writes down who asked, from
  where, and for what. That is the deal sudo makes, and it is the reason a
  team can share a server without sharing a secret.

  See the deal from both sides. Ask sudo what it would let you run and read
  the rule that grants it, then write down the name of the group that rule is
  tied to. Run one harmless command through sudo and go and find the record it
  left in the journal; you may read the system journal because you are in
  wheel. Finally, forget your cached credentials on purpose. For a few minutes
  after each use, sudo does not ask again, which is convenient at a keyboard
  and a risk at one you walked away from.
steps:
  - Save what sudo lets you run in `~/pridwen/answers/sudo-l.txt` and read the rule it comes from.
  - Write the name of the group that grants sudo on Pridwen in `~/pridwen/answers/sudo-group.txt`.
  - Run one harmless command through sudo, find its record in the journal, and save that line in `~/pridwen/answers/sudo-log.txt`.
  - Drop your cached credentials so the next sudo asks for a password again.
hints:
  - "`sudo -l` lists your rules; `(ALL) ALL` is the wheel rule from `/etc/sudoers`."
  - "`sudo true` does nothing except leave a record; `journalctl _COMM=sudo -n 3` finds it."
  - "`sudo -k` forgets the timestamp; afterwards `sudo -n true` fails with exit 1 because it is not allowed to prompt."
checks:
  - id: sudo-l
    type: path_contains
    path: "{home}/pridwen/answers/sudo-l.txt"
    regex: '\(ALL\)\s+ALL'
    fail: "`sudo-l.txt` should show your rule, `(ALL) ALL`; if `sudo -l` refused you, you are not in wheel."
  - id: sudo-group
    type: path_contains
    path: "{home}/pridwen/answers/sudo-group.txt"
    regex: '^wheel\s*$'
    fail: "`sudo-group.txt` should hold the group name from the sudoers rule, on its own line."
  - id: sudo-log
    type: path_contains
    path: "{home}/pridwen/answers/sudo-log.txt"
    regex: 'COMMAND='
    fail: "`sudo-log.txt` should hold a journal line from sudo, the one with `USER=root ; COMMAND=`."
  - id: no-cache
    type: cmd_exit
    cmd: ["sudo", "-n", "true"]
    exit: 1
    fail: "`sudo -n true` exited {actual}; 1 means sudo would have to prompt, which is what you want after `sudo -k`. 0 means credentials are still cached or a rule skips the password."
cleanup: |
  rm -f ~/pridwen/answers/sudo-l.txt ~/pridwen/answers/sudo-group.txt ~/pridwen/answers/sudo-log.txt
