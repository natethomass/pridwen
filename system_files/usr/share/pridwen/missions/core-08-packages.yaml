id: core-08-packages
node: packages
title: Know what you are running
track: core
required: true
minutes: 15
target: host
brief: |
  A friend asks what version of Linux you are on and whether you can install
  a tool for them. On a traditional distribution you would answer with
  `dnf`, the package manager that installs RPM packages one at a time onto a
  writable system. On Pridwen the system is an image: one read-only snapshot
  of `/usr`, built elsewhere, tested as a whole, and swapped for the next
  one at the next boot. There is no `dnf` on the host because nothing on the
  host is meant to be installed piecemeal, and that is why an update can
  never leave you half-upgraded and why a bad one can be rolled back.

  So the honest answer has three parts: the image the whole system boots
  from, the Flatpaks layered on top for the desktop, and the containers
  where anything mutable lives. A Flatpak is a desktop app in its own
  sandbox, installed from a remote (a catalogue of apps), and Pridwen's only
  remote is Flathub. A container is a small, disposable Linux that runs as
  you; the containers mission covers it. Read each layer for yourself.
  `rpm-ostree status` lists the deployments, the images this machine can
  boot, with a dot on the one you are running and a digest, the long hash
  that identifies an image exactly. `flatpak remotes` lists where apps come
  from. Install one app you will actually use: Flatseal, which shows and
  edits the sandbox permissions of every other Flatpak. Finally, answer a
  question the image can still take: which RPM package put `podman` on this
  machine. `rpm -q` queries the package database, which is still there and
  still accurate; only the tools that write to it are gone.

  On a job, "what is installed here and where did it come from" is the first
  question of every audit. Done looks like three answer files and Flatseal
  in your app grid. The checker reads the three files for the image name,
  the word `flathub` and a package name starting `podman-`, and runs
  `flatpak list` itself to look for Flatseal's id.
steps:
  - >-
    Print the deployment listing with `rpm-ostree status` and save it in
    `~/pridwen/answers/rpm-ostree-status.txt`. Expect a deployment marked
    with a dot that names `ghcr.io/natethomass/pridwen` and has a `Digest:`
    line.
  - >-
    List the Flatpak remotes with `flatpak remotes` and save them in
    `~/pridwen/answers/flatpak-remotes.txt`. Expect `flathub` and nothing you
    did not add.
  - >-
    Install Flatseal (`com.github.tchx84.Flatseal`) from Flathub with
    `flatpak install`, open it from the app grid, and look at the
    permissions of one app. Expect a question to confirm, then a progress
    bar, then a new icon in the grid.
  - >-
    Ask `rpm` which package owns `/usr/bin/podman` and write its name in
    `~/pridwen/answers/podman-package.txt`. Expect one line starting
    `podman-`.
hints:
  - >-
    `rpm-ostree status` works without sudo; the booted deployment is the one
    marked with a dot, and the lines under it name the image and its
    digest. `flatpak remotes` lists where apps come from. `rpm -qf PATH`
    (`-q` query, `-f` by file) answers which package owns a file; every
    read-only `rpm -q` question keeps working on an image even though `dnf`
    is gone.
  - >-
    `flatpak install REMOTE APP-ID` installs one app: `flathub` is the remote
    and `com.github.tchx84.Flatseal` is the id, the reverse-domain name every
    Flatpak carries. It asks `Proceed with these changes?` and `y` continues.
    Add `--user` to install into your home rather than system-wide if it
    asks for an administrator password. `>` sends a command's output into a
    file.
  - >-
    `rpm-ostree status > ~/pridwen/answers/rpm-ostree-status.txt`, then
    `flatpak remotes > ~/pridwen/answers/flatpak-remotes.txt`, then
    `flatpak install flathub com.github.tchx84.Flatseal`, then
    `rpm -qf /usr/bin/podman > ~/pridwen/answers/podman-package.txt`.
checks:
  - id: status
    type: path_contains
    path: "{home}/pridwen/answers/rpm-ostree-status.txt"
    regex: 'ghcr\.io/natethomass/pridwen'
    fail: >-
      `rpm-ostree-status.txt` is {actual} and does not name
      `ghcr.io/natethomass/pridwen`, the image this host boots from.
      `rpm-ostree status > ~/pridwen/answers/rpm-ostree-status.txt` saves the
      listing.
  - id: remotes
    type: path_contains
    path: "{home}/pridwen/answers/flatpak-remotes.txt"
    regex: 'flathub'
    fail: >-
      `flatpak-remotes.txt` is {actual} and does not mention `flathub`, the
      only remote Pridwen ships.
      `flatpak remotes > ~/pridwen/answers/flatpak-remotes.txt` saves the
      list; if the list is empty, `flatpak remotes --show-disabled` shows
      whether Flathub was switched off.
  - id: flatseal
    type: cmd_output
    cmd: ["flatpak", "list", "--columns=application"]
    regex: '^com\.github\.tchx84\.Flatseal$'
    fail: >-
      `flatpak list` (first line: {actual}) does not include
      `com.github.tchx84.Flatseal`; the install may still be running, or it
      may have been declined at the `Proceed` question.
      `flatpak install flathub com.github.tchx84.Flatseal` and answer `y`.
  - id: podman-package
    type: path_contains
    path: "{home}/pridwen/answers/podman-package.txt"
    regex: '^podman-\d'
    fail: >-
      `podman-package.txt` is {actual} and does not hold a package name
      starting `podman-`.
      `rpm -qf /usr/bin/podman > ~/pridwen/answers/podman-package.txt` writes
      the name of the package that owns that file.
cleanup: |
  flatpak uninstall -y --noninteractive com.github.tchx84.Flatseal >/dev/null 2>&1 || true
  rm -f ~/pridwen/answers/rpm-ostree-status.txt ~/pridwen/answers/flatpak-remotes.txt ~/pridwen/answers/podman-package.txt
