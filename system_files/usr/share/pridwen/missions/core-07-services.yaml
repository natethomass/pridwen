id: core-07-services
node: services
title: Your first user service
track: core
required: true
minutes: 15
target: host
brief: |
  The Coach that has been commenting on your commands is not magic. It is a
  user service, `pridwend.service`, a small program systemd starts for you when
  you log in, without root and without anyone else on the machine noticing.
  Reading how it is described is the fastest way to learn the shape of a unit.

  Then write one of your own. `pridwen-hello.service` should run once, log the
  word `ready`, and still count as active afterwards, which is the pattern for
  work that finishes but whose state you want to see. Start it and confirm it
  is active. Enable it and confirm it is enabled. Those are two different
  questions with two different answers, and the difference explains most of the
  "it worked until I rebooted" stories you will ever hear. Finish by finding
  the line it logged in your own journal.
steps:
  - Read how the Coach's daemon unit is described.
  - Write `~/.config/systemd/user/pridwen-hello.service` so that it prints or logs the word `ready` once and stays active after the program has exited.
  - Tell systemd to read the new file, then start the service and confirm it is active.
  - Enable it so it comes back at your next login, and confirm it is enabled.
  - Find the line it logged in your user journal.
hints:
  - "`systemctl --user cat pridwend.service` shows a working unit. Yours needs `[Unit]`, `[Service]` and `[Install]`; `Type=oneshot` with `RemainAfterExit=yes` is run-once-and-stay-active, and `WantedBy=default.target` is the install target for user units."
  - "`systemctl --user daemon-reload` after every edit, then `systemctl --user start pridwen-hello` and `systemctl --user status pridwen-hello`. `ExecStart=/usr/bin/echo ready` is enough."
  - "`systemctl --user enable pridwen-hello` links it into `default.target.wants`; `journalctl --user -u pridwen-hello` shows what it logged."
checks:
  - id: unit-file
    type: path_exists
    path: "{home}/.config/systemd/user/pridwen-hello.service"
    fail: "There is no `~/.config/systemd/user/pridwen-hello.service` yet; user units live in that directory."
  - id: active
    type: unit_active
    unit: pridwen-hello.service
    scope: user
    fail: "`systemctl --user is-active pridwen-hello.service` says {actual}. A oneshot without `RemainAfterExit=yes` goes inactive as soon as it finishes."
  - id: enabled
    type: unit_enabled
    unit: pridwen-hello.service
    scope: user
    fail: "`is-enabled` says {actual}; enabling is what makes it start at your next login, and it needs an `[Install]` section to work."
  - id: logged
    type: journal_has
    regex: 'ready'
    unit: pridwen-hello.service
    since: "-24h"
    fail: "Nothing from `pridwen-hello.service` in your user journal today; start it after the file is right, then read `journalctl --user -u pridwen-hello.service`."
cleanup: |
  systemctl --user disable --now pridwen-hello.service >/dev/null 2>&1 || true
  rm -f ~/.config/systemd/user/pridwen-hello.service
  systemctl --user daemon-reload
