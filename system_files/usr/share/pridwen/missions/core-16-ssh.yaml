id: core-16-ssh
node: ssh
title: Make a key
track: core
required: true
minutes: 10
target: host
brief: |
  The Range labs, a Raspberry Pi on the shelf, a server at work: every one
  of them will ask you to prove who you are, and the answer that holds up
  is a key pair, not a password typed over the network. ssh (secure shell)
  is the tool for logging in to another machine, and a key pair is two files
  made together: a private key that never leaves this machine and a public
  key you hand out. A server that has your public key can check that you
  hold the private one without the private one ever crossing the wire, and
  no password can be guessed, phished or reused. `ssh-keygen` makes the
  pair. ed25519 is the modern key type: short, fast, and the one to choose
  unless something old forces your hand.

  Make yours now, before you need it. Give it a comment that names you and
  this machine so you can recognise it in a list of authorized keys a year
  from now, and protect it with a passphrase, a password that unlocks the
  private key file itself so a stolen laptop does not hand out your keys.
  Then look at what you made. One of the two files is a secret, and ssh will
  refuse to use it if anyone else on the machine could read it, so check
  the modes of both the key and the `~/.ssh` directory it lives in. Finish
  by printing the key's fingerprint, the short `SHA256:` string that
  identifies a key and that you will compare when a server shows one back
  to you.

  On a job you will paste the public half into servers, cloud consoles and
  git forges weekly, and the fingerprint is how you check the right key
  landed. Done looks like two files under `~/.ssh` at the right modes and
  the fingerprint saved. The checker reads the public key file for the
  `ssh-ed25519` line with a comment, checks the permission bits of the
  private key and of `~/.ssh`, and reads your saved fingerprint line.
steps:
  - >-
    Generate an ed25519 key pair at `~/.ssh/pridwen_ed25519` with
    `ssh-keygen`, a comment that names you and this machine, and a
    passphrase you will remember. Expect two prompts for the passphrase,
    then a randomart box and two new files.
  - >-
    List `~/.ssh` with `ls -l` and decide which of the two files is the
    secret. Expect `pridwen_ed25519` at `-rw-------` and
    `pridwen_ed25519.pub` at `-rw-r--r--`.
  - >-
    Make sure `~/.ssh` is closed to everyone but you and the private key is
    readable by you alone, with `chmod` if needed. Expect `drwx------` on
    the directory.
  - >-
    Print the key's fingerprint with `ssh-keygen` and save it in
    `~/pridwen/answers/ssh-fingerprint.txt`. Expect one line: `256`, a
    `SHA256:` string, your comment and `(ED25519)`.
hints:
  - >-
    `ssh-keygen -t ed25519 -C 'comment' -f ~/.ssh/pridwen_ed25519` makes the
    pair: `-t` is the key type, `-C` the comment stored in the public key,
    `-f` the file to write (the public half gets `.pub` added). It asks for
    a passphrase twice; typing shows nothing, which is normal. `ls -l ~/.ssh`
    and `ls -ld ~/.ssh` show the modes.
  - >-
    `chmod 700 ~/.ssh` and `chmod 600 ~/.ssh/pridwen_ed25519` close them to
    everyone but you; ssh refuses a private key others can read with
    `Permissions 0644 for ... are too open`. `ssh-keygen -l -f FILE` prints
    the fingerprint: `-l` lists, `-f` names the key file, and the `.pub`
    file is enough.
  - >-
    `ssh-keygen -t ed25519 -C '{user}@{host}' -f ~/.ssh/pridwen_ed25519`,
    then `chmod 700 ~/.ssh`, then `chmod 600 ~/.ssh/pridwen_ed25519`, then
    `ssh-keygen -lf ~/.ssh/pridwen_ed25519.pub > ~/pridwen/answers/ssh-fingerprint.txt`.
checks:
  - id: public-key
    type: path_contains
    path: "{home}/.ssh/pridwen_ed25519.pub"
    regex: '^ssh-ed25519 [A-Za-z0-9+/=]+ \S+'
    fail: >-
      `pridwen_ed25519.pub` is {actual} and does not hold the expected single
      line: `ssh-ed25519`, the key, then a comment. The comment is the part
      usually missing;
      `ssh-keygen -t ed25519 -C '{user}@{host}' -f ~/.ssh/pridwen_ed25519`
      makes a pair with one (answer `y` if it asks to overwrite).
  - id: private-mode
    type: path_mode
    path: "{home}/.ssh/pridwen_ed25519"
    mode: "0600"
    fail: >-
      The private key has mode {actual}; it must be 0600, readable and
      writable by you alone, or ssh will refuse to use it.
      `chmod 600 ~/.ssh/pridwen_ed25519` sets it.
  - id: ssh-dir-mode
    type: path_mode
    path: "{home}/.ssh"
    mode: "0700"
    fail: >-
      `~/.ssh` has mode {actual}; it should be 0700 so nobody else can even
      list your keys. `chmod 700 ~/.ssh` sets it.
  - id: fingerprint
    type: path_contains
    path: "{home}/pridwen/answers/ssh-fingerprint.txt"
    regex: 'SHA256:\S+.*\(ED25519\)'
    fail: >-
      `ssh-fingerprint.txt` is {actual} and does not hold the
      `ssh-keygen -lf` line: bits, a `SHA256:` fingerprint, the comment, and
      `(ED25519)`.
      `ssh-keygen -lf ~/.ssh/pridwen_ed25519.pub > ~/pridwen/answers/ssh-fingerprint.txt`
      writes it.
cleanup: |
  rm -f ~/.ssh/pridwen_ed25519 ~/.ssh/pridwen_ed25519.pub
  rm -f ~/pridwen/answers/ssh-fingerprint.txt
